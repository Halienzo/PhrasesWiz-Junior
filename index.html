<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>✨ PhrasesWiz Junior · 短语精灵</title>
<style>
:root{
  --orange:#FF8C00; --orange-light:#FFA940;
  --green:#228B22; --green-light:#2E8B57;
  --bg:#fafafa; --surface:#ffffff; --text:#222; --text-muted:#666;
  --border:#e0e0e0; --accent:#1a73e8; --danger:#d93025; --ok:#188038;
  --shadow:0 1px 3px rgba(0,0,0,.1); --radius:8px;
  --tag-bg:#f1f3f4; --tag-text:#5f6368;
}
[data-theme="dark"]{
  --bg:#1a1a1a; --surface:#2a2a2a; --text:#e8e8e8; --text-muted:#aaa;
  --border:#3a3a3a; --accent:#8ab4f8; --danger:#f28b82; --ok:#81c995;
  --shadow:0 1px 3px rgba(0,0,0,.4);
  --tag-bg:#3a3a3a; --tag-text:#bbb;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);line-height:1.6;transition:background .2s,color .2s}
button{font-family:inherit;cursor:pointer;border:1px solid var(--border);background:var(--surface);color:var(--text);padding:6px 14px;border-radius:var(--radius);transition:all .15s;font-size:14px}
button:hover{border-color:var(--accent);color:var(--accent)}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.primary:hover{opacity:.9;color:#fff}
button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
input[type="text"]{font-family:inherit;font-size:14px;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--surface);color:var(--text);width:100%}
input[type="text"]:focus{outline:none;border-color:var(--accent)}
input[type="checkbox"]{cursor:pointer}

header{position:sticky;top:0;z-index:100;background:var(--surface);border-bottom:1px solid var(--border);box-shadow:var(--shadow);padding:8px 12px}
.header-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.title{font-size:20px;font-weight:800;margin-right:6px;white-space:nowrap;font-family:"Georgia","Times New Roman",serif;letter-spacing:.5px;display:inline-flex;align-items:center;gap:2px}
.title-icon{font-size:18px;animation:bounceRotate 2s ease-in-out infinite;display:inline-block}
.title-main{background:linear-gradient(135deg,#FF6B35 0%,#FFD700 50%,#FF1493 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:warmGlow 3s ease-in-out infinite}
.title-wiz{background:linear-gradient(225deg,#7B2FF7 0%,#00D4FF 50%,#39FF14 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-style:italic;animation:breathe 2.5s ease-in-out infinite}
.title-junior{background:linear-gradient(45deg,#FF0080 0%,#FF8C00 50%,#FFD700 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;font-size:16px;animation:wiggle 1.5s ease-in-out infinite;margin-left:4px}
.title-cn{font-size:14px;margin-left:6px;font-weight:400;font-family:"Microsoft YaHei","PingFang SC",sans-serif;font-style:normal;letter-spacing:0;background:linear-gradient(135deg,#00BFA5 0%,#448AFF 50%,#E040FB 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:floatBreathe 3.5s ease-in-out infinite}
@keyframes floatBreathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 3px rgba(0,191,165,.35))}50%{transform:scale(1.06);filter:drop-shadow(0 0 12px rgba(224,64,251,.6))}}
@keyframes bounceRotate{0%{transform:scale(1) rotate(0deg) translateY(0)}25%{transform:scale(1.3) rotate(90deg) translateY(-3px)}50%{transform:scale(1.15) rotate(180deg) translateY(0)}75%{transform:scale(1.35) rotate(270deg) translateY(-4px)}100%{transform:scale(1) rotate(360deg) translateY(0)}}
@keyframes warmGlow{0%,100%{filter:drop-shadow(0 0 4px rgba(255,107,53,.4))}50%{filter:drop-shadow(0 0 16px rgba(255,20,147,.7))}}
@keyframes breathe{0%,100%{transform:scale(1);filter:drop-shadow(0 0 4px rgba(123,47,247,.4))}50%{transform:scale(1.08);filter:drop-shadow(0 0 14px rgba(0,212,255,.75))}}
@keyframes wiggle{0%,100%{transform:rotate(0deg) translateY(0)}15%{transform:rotate(-3deg) translateY(-2px)}30%{transform:rotate(3deg) translateY(0)}45%{transform:rotate(-2deg) translateY(-1px)}60%{transform:rotate(2deg) translateY(0)}75%{transform:rotate(-1deg) translateY(-2px)}}
[data-theme="dark"] .title-icon{filter:brightness(1.3)}
[data-theme="dark"] .title-main{filter:drop-shadow(0 0 12px rgba(255,200,50,.8))}
[data-theme="dark"] .title-wiz{filter:drop-shadow(0 0 12px rgba(0,230,255,.85))}
[data-theme="dark"] .title-junior{filter:drop-shadow(0 0 10px rgba(255,0,128,.7))}
[data-theme="dark"] .title-cn{filter:drop-shadow(0 0 10px rgba(0,191,165,.65))}
.sem-tabs{display:flex;gap:4px;overflow-x:auto;flex-wrap:nowrap;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sem-tabs::-webkit-scrollbar{display:none}
.sem-tab{padding:5px 11px;border-radius:6px;font-size:13px;white-space:nowrap;flex-shrink:0}
.mode-tabs{display:flex;gap:4px;overflow-x:auto;flex-wrap:nowrap;margin-top:6px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.mode-tabs::-webkit-scrollbar{display:none}
.mode-tab{padding:5px 11px;border-radius:6px;font-size:13px;white-space:nowrap;flex-shrink:0}
.spacer{flex:1;min-width:0}
.icon-btn{padding:6px 10px;font-size:16px;flex-shrink:0}
.search-box{width:180px;min-width:120px;flex-shrink:1}
.progress-mini{font-size:12px;color:var(--text-muted);white-space:nowrap}

main{max-width:1200px;margin:0 auto;padding:16px}
.filter-toggle{display:none;width:100%;margin-bottom:10px;padding:8px 12px;font-size:14px;background:var(--surface);border:1px solid var(--border)}
.layout{display:grid;grid-template-columns:220px 1fr;gap:16px;align-items:start}
.sidebar-wrap{position:relative}
.sidebar{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px}
@media(min-width:601px){ .sidebar{position:sticky;top:120px;max-height:calc(100vh - 140px);overflow-y:auto} }
.sidebar h4{margin:12px 0 6px;font-size:13px;color:var(--text-muted)}
.sidebar h4:first-child{margin-top:0}
.filter-btn{display:block;width:100%;text-align:left;margin:3px 0;padding:6px 8px;font-size:13px;border-radius:5px;border:1px solid transparent;background:transparent}
.filter-btn:hover{background:var(--tag-bg)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.sidebar-backdrop{display:none}
.content{min-width:0}

.phrase-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.phrase-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.phrase-num{font-size:13px;color:var(--text-muted);min-width:32px}
.phrase-word{font-size:18px;font-weight:700;color:var(--orange)}
.tag{display:inline-block;padding:2px 8px;border-radius:10px;font-size:12px;background:var(--tag-bg);color:var(--tag-text)}
.stars{color:var(--orange);font-size:13px;letter-spacing:1px}
.card-actions{margin-left:auto;display:flex;gap:6px}
.card-actions button{padding:4px 10px;font-size:13px}
.card-actions .mastered{background:var(--ok);color:#fff;border-color:var(--ok)}
.card-actions .mastered:hover{color:#fff}
.example{margin:8px 0;padding-left:12px;border-left:3px solid var(--border)}
.example-basic{border-left-color:var(--orange)}
.example-adv{border-left-color:var(--green)}
.example-label{font-size:12px;color:var(--text-muted);margin-bottom:2px}
.example-cn{font-size:14px;color:var(--text);margin-bottom:2px}
.example-en{font-size:14px;font-style:italic}
.hl-phrase{color:var(--orange);font-weight:700;font-style:normal}
.hl-be{color:var(--orange);font-weight:700;font-style:normal;text-decoration:underline;text-decoration-style:dotted}
details.adv-details{margin-top:6px}
details.adv-details summary{cursor:pointer;font-size:13px;color:var(--green);padding:4px 0;user-select:none}
details.adv-details summary:hover{text-decoration:underline}
.vocab-line{margin-top:6px;font-size:13px;color:var(--green);background:rgba(34,139,34,.06);padding:6px 10px;border-radius:5px}
.vocab-word{font-weight:700;font-style:italic}
.usage-note{font-size:13px;color:#1a6fb5;background:rgba(26,111,181,.08);padding:6px 10px;border-radius:5px;margin:6px 0}
.verb-forms-details{margin-top:4px;font-size:13px}
.verb-forms-details summary{cursor:pointer;color:#666;padding:3px 0;user-select:none}
.verb-forms-details summary:hover{color:var(--accent)}
.verb-forms-table{width:100%;border-collapse:collapse;margin-top:6px;font-size:12px}
.verb-forms-table td{border:1px solid var(--border);padding:3px 8px;color:#87CEEB}
.verb-forms-table td:first-child{background:#f5f5f5;font-weight:600;width:160px;white-space:nowrap}
[data-theme="dark"] .verb-forms-table td:first-child{background:#333}
[data-theme="dark"] .verb-forms-table td{color:#87CEEB}
.vfw{font-family:monospace;font-weight:700;font-style:italic;color:#87CEEB}
[data-theme="dark"] .vfw{color:#87CEEB}
.vocab-pos{color:var(--green-light);margin:0 4px}

.test-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px;padding:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius)}
.test-toolbar label{font-size:13px;display:flex;align-items:center;gap:4px;cursor:pointer}
.test-toolbar .score{margin-left:auto;font-weight:700;color:var(--accent)}
.training-block{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px}
.training-title{font-weight:700;margin-bottom:8px;color:var(--accent)}
.q-row{display:flex;align-items:flex-start;gap:8px;padding:8px 0;border-bottom:1px dashed var(--border);flex-wrap:wrap}
.q-num{min-width:34px;color:var(--text-muted);font-weight:600;padding-top:4px}
.q-body{flex:1;min-width:200px}
.q-sentence{font-size:14px;margin-bottom:4px}
.q-input{min-width:140px;max-width:240px}
.q-hint{font-size:12px;color:var(--text-muted)}
.q-feedback{font-size:13px;margin-top:4px}
.q-feedback.ok{color:var(--ok)}
.q-feedback.bad{color:var(--danger)}
.q-feedback .ans{color:var(--orange);font-weight:600}
input.q-input.correct{border-color:var(--ok);background:rgba(24,128,56,.08)}
input.q-input.wrong{border-color:var(--danger);background:rgba(217,48,37,.08)}

.flashcard-wrap{display:flex;flex-direction:column;align-items:center;gap:16px;padding:30px}
.flashcard{width:420px;max-width:90vw;height:240px;perspective:1000px;cursor:pointer}
.fc-inner{width:100%;height:100%;transition:transform .5s;transform-style:preserve-3d;position:relative}
.flashcard.flipped .fc-inner{transform:rotateY(180deg)}
.fc-face{position:absolute;width:100%;height:100%;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;border:2px solid var(--border);border-radius:14px;padding:20px;background:var(--surface);box-shadow:var(--shadow)}
.fc-back{transform:rotateY(180deg)}
.fc-word{font-size:26px;font-weight:700;color:var(--orange);text-align:center}
.fc-cn{font-size:20px;text-align:center}
.fc-en{font-size:15px;font-style:italic;text-align:center;margin-top:8px;color:var(--text-muted)}
.fc-meta{font-size:13px;color:var(--text-muted);margin-top:12px}
.fc-actions{display:flex;gap:14px}

.dict-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.dict-prompt{flex:1;min-width:160px;font-size:15px}
.dict-prompt .pw{color:var(--orange);font-weight:700}
.dict-input{min-width:160px;max-width:300px}
.dict-fb{font-size:13px;min-width:100px}
.dict-input.correct{border-color:var(--ok);background:rgba(24,128,56,.08)}
.dict-input.wrong{border-color:var(--danger);background:rgba(217,48,37,.08)}

.pdf-panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:20px}
.pdf-panel h3{margin-top:0}
.pdf-options{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.pdf-opt{padding:12px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.pdf-opt.active{border-color:var(--accent);background:rgba(26,115,232,.06)}
.pdf-opt input{margin-right:6px}
.pdf-opt label{cursor:pointer;font-weight:600}
.pdf-hint{font-size:13px;color:var(--text-muted);margin:10px 0}

/* ===== 响应式：Pad 端 (<=1024px) ===== */
@media(max-width:1024px){
  .layout{grid-template-columns:180px 1fr;gap:12px}
  main{padding:12px}
  .phrase-word{font-size:17px}
}
/* ===== 响应式：手机端 (<=600px) ===== */
@media(max-width:600px){
  header{padding:6px 10px}
  .title{font-size:16px}
  .title-icon{font-size:15px}
  .title-junior{font-size:13px}
  .title-cn{font-size:11px}
  .header-row{gap:6px}
  .search-box{width:100%;order:5;flex-basis:100%}
  .progress-mini{font-size:11px}
  .icon-btn{padding:5px 8px}
  .sem-tab,.mode-tab{padding:5px 10px;font-size:12px}
  main{padding:10px}
  .filter-toggle{display:block}
  .layout{grid-template-columns:1fr;gap:0}
  .sidebar-wrap{position:fixed;top:0;left:0;bottom:0;width:78%;max-width:300px;z-index:200;transform:translateX(-100%);transition:transform .25s ease;overflow-y:auto;background:var(--bg);padding:12px}
  .sidebar-wrap.open{transform:translateX(0);box-shadow:2px 0 12px rgba(0,0,0,.2)}
  .sidebar-backdrop{display:block;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:150}
  .sidebar{border:none;background:var(--surface)}
  .phrase-card{padding:12px}
  .phrase-word{font-size:19px}
  .phrase-head{gap:8px}
  .tag{font-size:11px}
  .example-cn,.example-en{font-size:13.5px}
  .q-row{gap:6px}
  .q-body{min-width:0;flex-basis:100%}
  .q-num{padding-top:2px}
  .q-input{min-width:0;flex:1;max-width:100%}
  .q-sentence{font-size:13.5px;word-break:break-word}
  .flashcard{width:100%;height:220px}
  .fc-word{font-size:22px}
  .fc-cn{font-size:17px}
  .fc-en{font-size:13px}
  .fc-actions{flex-wrap:wrap;justify-content:center}
  .dict-row{flex-direction:column;align-items:stretch;gap:6px}
  .dict-input{max-width:100%}
  .pdf-options{grid-template-columns:1fr}
}

@media print{
  @page{margin:18mm 16mm}
  body{background:#fff;color:#000}
  header,.sidebar,.test-toolbar,.no-print{display:none!important}
  main{max-width:100%;padding:0}
  .layout{grid-template-columns:1fr}
  .content{display:none}
  .print-area{display:block!important}
  .print-sheet{page-break-after:always;margin-bottom:20px}
  .print-sheet:last-child{page-break-after:auto}
  .print-h1{font-size:20px;font-weight:700;text-align:center;margin:0 0 6px}
  .print-h2{font-size:15px;text-align:center;color:#444;margin:0 0 14px}
  .print-q{margin:14px 0;padding-left:0;font-size:14px;line-height:2.4;page-break-inside:avoid}
  .print-q .n{font-weight:700;margin-right:8px}
  .print-q .blank{display:inline-block;border-bottom:1.5px solid #333;min-width:140px;height:18px;margin:0 2px;vertical-align:bottom}
  .print-hint{color:#666;font-size:13px;margin-left:4px}
  .print-ans-sheet .print-q{line-height:1.8}
  .print-ans{color:#FF8C00;font-weight:600}
  .print-table{width:100%;border-collapse:collapse;font-size:13px}
  .print-table th,.print-table td{border:1px solid #999;padding:8px 8px;text-align:left}
  .print-table th{background:#f0f0f0}
  .print-table .pw{color:#FF8C00;font-weight:700}
  .print-phrase-block{margin:14px 0;padding:8px 10px;border:1px solid #ccc;border-radius:4px;page-break-inside:avoid}
  .print-phrase-block .pw{color:#FF8C00;font-weight:700;font-size:15px}
  .print-phrase-block .ex{font-size:13px;margin:3px 0}
  .print-phrase-block .vocab{color:#228B22;font-size:12px;margin-top:4px}
}

.empty-state{text-align:center;padding:60px 20px;color:var(--text-muted)}
.empty-state .big{font-size:48px;margin-bottom:10px}
.kbd{display:inline-block;padding:1px 6px;border:1px solid var(--border);border-radius:3px;font-size:12px;font-family:monospace;background:var(--tag-bg)}
details summary{outline:none}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:6px;z-index:1000;opacity:0;transition:opacity .3s}
.toast.show{opacity:1}
/* ===== 逐题批改按钮 ===== */
.q-grade-btn{padding:4px 12px;font-size:12px;border-radius:5px;background:var(--accent);color:#fff;border:1px solid var(--accent);cursor:pointer;white-space:nowrap;flex-shrink:0;align-self:flex-start;margin-left:6px;transition:all .15s}
.q-grade-btn:hover{opacity:.85;color:#fff;border-color:var(--accent)}
/* ===== 批改动画 ===== */
@keyframes pulseGreen{0%{box-shadow:0 0 0 0 rgba(24,128,56,.5)}50%{box-shadow:0 0 0 10px rgba(24,128,56,0)}100%{box-shadow:0 0 0 0 rgba(24,128,56,0)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(4px)}}
@keyframes fadeInUp{0%{opacity:0;transform:translateY(6px)}100%{opacity:1;transform:translateY(0)}}
input.q-input.correct-anim{animation:pulseGreen .5s ease}
input.q-input.wrong-anim{animation:shake .4s ease}
input.dict-input.correct-anim{animation:pulseGreen .5s ease}
input.dict-input.wrong-anim{animation:shake .4s ease}
.q-feedback.fadeInUp,.dict-fb.fadeInUp{animation:fadeInUp .35s ease}

/* ===== 考点辨析模块 (Pitfalls) ===== */
.pitfalls-layout{display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start}
.pitfalls-cats{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:10px;position:sticky;top:120px;max-height:calc(100vh - 160px);overflow-y:auto}
.pitfalls-cats h4{font-size:13px;color:var(--text-muted);margin:0 0 6px;padding:0 4px}
.pitfalls-cat-btn{display:block;width:100%;text-align:left;margin:2px 0;padding:5px 8px;font-size:12px;border-radius:4px;border:1px solid transparent;background:transparent;white-space:normal;line-height:1.4}
.pitfalls-cat-btn:hover{background:var(--tag-bg)}
.pitfalls-cat-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.pitfalls-cat-count{float:right;font-size:10px;opacity:.7;margin-left:4px}
.pitfalls-content{min-width:0}
.pitfalls-search{margin-bottom:12px}
.pitfalls-search input{max-width:400px;padding:7px 12px}
.pitfalls-stats{font-size:12px;color:var(--text-muted);margin-bottom:12px}

/* Grammar primer card */
.grammar-primer{background:linear-gradient(135deg, rgba(26,115,232,.04) 0%, rgba(155,89,182,.04) 100%);border:2px solid var(--accent);border-radius:var(--radius);padding:20px;margin-bottom:16px}
.grammar-primer h2{font-size:20px;margin:0 0 6px;color:var(--accent)}
.grammar-primer .principle-rule{background:var(--surface);border-left:4px solid var(--accent);padding:14px 18px;border-radius:4px;margin:14px 0;font-size:15px}
.grammar-primer .principle-rule strong{color:var(--accent)}
.grammar-primer .why-not{font-size:13px;color:var(--danger);padding:10px 14px;background:rgba(217,48,37,.06);border-radius:4px;margin:8px 0}
.five-types{margin-top:16px}
.type-card{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:12px 16px;margin-bottom:10px}
.type-card h4{font-size:15px;margin:0 0 4px;color:var(--accent)}
.type-card .type-explain{font-size:13px;color:var(--text-muted);margin-bottom:8px}
.type-card .type-examples{display:grid;grid-template-columns:1fr;gap:4px}
.type-card .type-ex{font-size:13px;padding:4px 8px;background:var(--tag-bg);border-radius:4px;display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.type-card .type-ex .ex-phrase{font-weight:700;color:var(--orange);font-family:monospace}
.type-card .type-ex .ex-from{font-size:11px;color:var(--text-muted)}
.type-card .type-ex .ex-analysis{font-size:11px;color:var(--green);margin-left:auto}
.grammar-primer .key-takeaway{background:var(--orange);color:#fff;padding:14px 18px;border-radius:6px;margin-top:16px;font-size:15px;font-weight:700;line-height:1.7}

/* Confusable pairs in grammar primer */
.confusable-box{margin-top:16px;background:var(--surface);border:1px solid var(--warning-color,#e6a817);border-radius:8px;padding:14px 18px}
.confusable-box h4{color:var(--warning-color,#b8860b);margin:0 0 8px;font-size:14px}

/* Pitfall card */
.pitfall-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;box-shadow:var(--shadow)}
.pitfall-card .pit-title{font-size:17px;font-weight:700;color:var(--accent);margin-bottom:4px}
.pitfall-card .pit-category{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:var(--tag-bg);color:var(--tag-text);margin-right:4px;margin-bottom:4px}
.pitfall-card .pit-diff{font-size:12px;color:var(--orange)}
.pit-rels{font-size:12px;color:var(--text-muted);margin:4px 0}
.pit-rels a{color:var(--orange);cursor:pointer;text-decoration:underline}
.pit-rels a:hover{color:var(--orange-light)}

/* Comparison table */
.pit-compare{width:100%;border-collapse:collapse;margin:12px 0;font-size:13px}
.pit-compare th{background:var(--tag-bg);padding:8px 10px;text-align:left;font-size:12px;color:var(--text-muted);border:1px solid var(--border)}
.pit-compare td{padding:8px 10px;border:1px solid var(--border);vertical-align:top}
.pit-compare .comp-phrase{font-weight:700;color:var(--orange);font-family:monospace;white-space:nowrap}
.pit-compare .comp-pos{font-size:11px;color:var(--text-muted)}
.pit-compare .comp-usage{font-size:12px}
.pit-compare tr:nth-child(even) td{background:rgba(0,0,0,.01)}
[data-theme="dark"] .pit-compare tr:nth-child(even) td{background:rgba(255,255,255,.02)}

/* Mistake display */
.pit-mistakes{margin:10px 0}
.pit-mistakes .mistake-row{display:flex;gap:10px;align-items:flex-start;margin:6px 0;font-size:13px;flex-wrap:wrap}
.pit-mistakes .wrong-box{background:rgba(217,48,37,.08);border-left:3px solid var(--danger);padding:6px 10px;border-radius:0 4px 4px 0;flex:1;min-width:200px}
.pit-mistakes .wrong-box .label{font-size:11px;color:var(--danger);font-weight:700}
.pit-mistakes .right-box{background:rgba(24,128,56,.08);border-left:3px solid var(--ok);padding:6px 10px;border-radius:0 4px 4px 0;flex:1;min-width:200px}
.pit-mistakes .right-box .label{font-size:11px;color:var(--ok);font-weight:700}
.pit-mistakes .explain{font-size:11px;color:var(--text-muted);margin-top:3px}

/* Test example */
.pit-test{background:var(--tag-bg);border-radius:6px;padding:12px 16px;margin:12px 0 0}
.pit-test .test-label{font-size:11px;color:var(--text-muted);margin-bottom:4px}
.pit-test .test-question{font-weight:600;margin-bottom:6px;font-size:14px}
.pit-test .test-options{font-size:13px;color:var(--text-muted);margin-bottom:6px}
.pit-test .test-show-btn{font-size:12px;padding:4px 10px;background:var(--accent);color:#fff;border:1px solid var(--accent);border-radius:4px;cursor:pointer}
.pit-test .test-show-btn:hover{opacity:.85;color:#fff}
.pit-test .test-answer{display:none;margin-top:8px;padding:8px 12px;background:rgba(24,128,56,.08);border-radius:4px;font-size:13px}
.pit-test .test-answer.show{display:block}
.pit-test .test-answer .correct-ans{color:var(--ok);font-weight:700}
.pit-test .test-answer .test-explain{font-size:12px;color:var(--text-muted);margin-top:2px}

/* Pitfall badge on phrase cards */
.pit-badges{margin-top:6px;display:flex;gap:4px;flex-wrap:wrap}
.pit-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:11px;background:rgba(26,115,232,.1);color:var(--accent);border:1px solid rgba(26,115,232,.2);cursor:pointer;white-space:nowrap}
.pit-badge:hover{background:var(--accent);color:#fff;border-color:var(--accent)}

/* Responsive pitfalls */
@media(max-width:768px){
  .pitfalls-layout{grid-template-columns:1fr;gap:12px}
  .pitfalls-cats{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:4px;padding:8px}
  .pitfalls-cats h4{display:none}
  .pitfalls-cat-btn{display:inline-block;width:auto;font-size:11px;padding:4px 8px}
  .pitfalls-cat-count{float:none;margin-left:2px}
  .pit-compare{font-size:11px}
  .pit-compare td,.pit-compare th{padding:6px}
}
@media(max-width:600px){
  .pitfall-card{padding:10px}
  .pitfall-card .pit-title{font-size:15px}
  .grammar-primer{padding:12px}
  .grammar-primer h2{font-size:17px}
  .type-card .type-ex{flex-direction:column;gap:2px}
  .type-card .type-ex .ex-analysis{margin-left:0}
  .pit-mistakes .mistake-row{flex-direction:column;gap:4px}
}
</style>

<script>
const PITFALLS = {"meta":{"version":"1.0","totalPitfalls":68,"categories":["形近/义近混淆","固定搭配·介词后接doing","含sb/sth槽位结构","一词多义","介词搭配辨析","时间/方位介词辨析","连词与时态/语序","形态变化易错","语法基础·介词后接成分总论"]},"grammarPrimer":{"id":"grammar-prep","title":"介词后接什么？——从 doing 到一切名词性成分","category":"语法基础·介词后接成分总论","difficulty":3,"summary":"很多学生把「介词 + doing」当作机械口诀背诵，但doing只是冰山一角。介词本质上需要一个「名词性成分」做宾语——名词、代词宾格、动名词(doing)、名词性从句都可以。理解了这个底层原理，就不会在介词后乱加to do或原形动词。","principle":{"rule":"介词（to / at / in / of / for / from / with / about / on ...）后面必须接名词性成分（能充当名词角色的结构）。","whyNotToDo":"不定式 to do 是「动词性」结构，不能直接作介词宾语。介词 to 和不定式 to 长得一样但本质不同——这是中国学生最易混淆的点。"},"fiveTypes":[{"type":"名词","label":"名词 (Noun)","explain":"介词后直接接名词，最简单的情形。","examples":[{"phrase":"look at the photo","from":"look at (7上#2)","analysis":"at + 名词 photo"},{"phrase":"listen to music","from":"listen to (7上#39)","analysis":"to + 名词 music"},{"phrase":"be late for school","from":"be late for (7下#11)","analysis":"for + 名词 school"},{"phrase":"be proud of her achievements","from":"be proud of (8下#45)","analysis":"of + 名词短语"},{"phrase":"be different from others","from":"be different from (7上#33)","analysis":"from + 名词 others"}]},{"type":"代词宾格","label":"代词宾格 (Object Pronoun)","explain":"介词后用宾格（me/him/her/us/them），绝不能用主格（I/he/she/we/they）。","examples":[{"phrase":"look at me","from":"look at (7上#2)","analysis":"at + 宾格 me（不是 I）"},{"phrase":"agree with him","from":"agree with (7下#84)","analysis":"with + 宾格 him（不是 he）"},{"phrase":"depend on them","from":"depend on (8上#79)","analysis":"on + 宾格 them（不是 they）"},{"phrase":"share it with us","from":"share sth with sb (8上#26)","analysis":"with + 宾格 us（不是 we）"}]},{"type":"动名词","label":"动名词 / doing (Gerund)","explain":"动词要作介词宾语，必须变成动名词 V-ing。这是考试最高频的考点。注意：介词 to（如 look forward to）后面的 doing 也属于此类——这里的 to 是介词，不是不定式符号。","examples":[{"phrase":"look forward to seeing you","from":"look forward to (7下#50)","analysis":"to(介) + doing，不是 to see！"},{"phrase":"be good at swimming","from":"be good at (7上#40)","analysis":"at + doing"},{"phrase":"be interested in reading","from":"be interested in (7上#48)","analysis":"in + doing"},{"phrase":"succeed in passing the exam","from":"succeed in doing sth (7下#102)","analysis":"in + doing"},{"phrase":"have fun (in) playing games","from":"have fun (7上#22)","analysis":"in 可省略，但后面仍是 doing"},{"phrase":"be worth reading","from":"be worth doing (9下#30)","analysis":"worth + doing（主动表被动）"},{"phrase":"stop him from smoking","from":"stop...from doing (8下#15)","analysis":"from + doing"},{"phrase":"keep on trying","from":"keep on doing sth (8上#65)","analysis":"on + doing"},{"phrase":"be/get used to getting up early","from":"be/get used to (8下#73)","analysis":"to(介) + doing，不是 to get up！"},{"phrase":"dream of becoming a doctor","from":"dream of (8下#10)","analysis":"of + doing"},{"phrase":"think about changing jobs","from":"think about (7下#22)","analysis":"about + doing"},{"phrase":"worry about failing","from":"worry about (8上#87)","analysis":"about + doing"}]},{"type":"Wh-名词性从句","label":"Wh-名词性从句 (Wh-Nominal Clause)","explain":"介词后可以接 wh- 引导的名词性从句（包括 what/when/where/how/whether 等），整体充当介词宾语。","examples":[{"phrase":"think about what to do next","from":"think about (7下#22)","analysis":"about + wh-不定式短语"},{"phrase":"depend on when we start","from":"depend on (8上#79)","analysis":"on + when 从句"},{"phrase":"pay attention to what the teacher says","from":"pay attention to (8上#94)","analysis":"to + what 从句"},{"phrase":"be interested in how it works","from":"be interested in (7上#48)","analysis":"in + how 从句"},{"phrase":"look forward to what you will bring","from":"look forward to (7下#50)","analysis":"to(介) + what 从句"}]},{"type":"That-从句","label":"That-名词性从句（少见但存在）","explain":"介词后直接接 that 从句在现代英语中较少见（that 从句作介词宾语通常需要先加 the fact），但「介词 + the fact + that 从句」是标准书面语表达。","examples":[{"phrase":"be proud of the fact that he won","from":"be proud of (8下#45)","analysis":"of + the fact + that从句"},{"phrase":"be aware of the fact that time is limited","from":"be aware of (9下#12)","analysis":"of + the fact + that从句"}]}],"keyTakeaway":"口诀：介词后面三类名——「名·代·doing」（名词、代词宾格、动名词），进阶再加「从句」行。关键是：绝不在介词后直接放动词原形或 to do（除非 to 本身是不定式符号，而非常规介词）。","confusablePrepositions":[{"pair":"to（介词）vs to（不定式符号）","how":"介词 to 后面接名词/代词/doing；不定式 to 后面接动词原形。如何判断？看 to 前面的词——如果 to 前面是 look forward / be used / be accustomed / object 等，to 往往是介词。如果不确定，试着在 to 后面放一个名词，如果通顺就是介词。","testPhrases":["look forward to","be/get used to","pay attention to","belong to","lead to"]}]},"pitfalls":[{"id":"pit-001","title":"a lot vs a lot of — 副词 vs 限定词","category":"形近/义近混淆","phrases":[{"semId":"7a","num":10},{"semId":"7a","num":20}],"comparison":[{"phrase":"a lot","pos":"副词短语","meaning":"非常、很","usage":"修饰动词/形容词，后面不接名词","eg":"She reads a lot. / I'm a lot happier now."},{"phrase":"a lot of","pos":"限定词短语","meaning":"很多、大量的","usage":"后接可数名词复数或不可数名词","eg":"A lot of people came."}],"commonMistakes":[{"wrong":"I have a lot books.","right":"I have a lot of books.","explain":"a lot 是副词，不能直接修饰名词"}],"testExample":{"type":"选择题","question":"He reads ___ every day. He has ___ books at home.","options":["A. a lot; a lot of","B. a lot of; a lot","C. a lot; a lot","D. a lot of; a lot of"],"answer":"A"},"difficulty":2},{"id":"pit-002","title":"every day vs everyday — 时间状语 vs 定语形容词","category":"形近/义近混淆","phrases":[{"semId":"7a","num":18}],"comparison":[{"phrase":"every day","pos":"副词短语（时间状语）","meaning":"每天（= each day）","usage":"修饰动词，回答 When? 的问题","eg":"I go to school every day."},{"phrase":"everyday","pos":"形容词（定语）","meaning":"日常的、平常的（= daily / ordinary）","usage":"放在名词前面修饰名词","eg":"This is an everyday problem."}],"commonMistakes":[{"wrong":"I go to school everyday.","right":"I go to school every day.","explain":"修饰动词 go 要用时间状语 every day（两个词）"},{"wrong":"This is an every day thing.","right":"This is an everyday thing.","explain":"修饰名词 thing 要用形容词 everyday（一个词）"}],"testExample":{"type":"改错题","question":"We have everyday English classes, and we speak English every day. (判断画线部分正误)","explain":"everyday English classes ✓（形容词修饰名词）；every day ✓（状语修饰 speak）——原句恰好正确，但考试常颠倒出题"},"difficulty":3},{"id":"pit-003","title":"in the future vs in future — 将来某个时间 vs 从今往后","category":"形近/义近混淆","phrases":[{"semId":"7a","num":41},{"semId":"8b","num":28}],"comparison":[{"phrase":"in the future","pos":"副词短语","meaning":"在将来（某个不确定的时间）","usage":"中性描述未来","eg":"Robots will do more work in the future."},{"phrase":"in future","pos":"副词短语","meaning":"从今往后、今后（= from now on）","usage":"含警告/建议口吻","eg":"In future, be more careful with your money."}],"commonMistakes":[{"wrong":"In the future, please arrive on time.","right":"In future, please arrive on time.","explain":"对今后行为的告诫/建议用 in future"},{"wrong":"Nobody knows what will happen in future.","right":"Nobody knows what will happen in the future.","explain":"中性描述将来用 in the future"}],"testExample":{"type":"选择题","question":"___ please lock the door when you leave the office.","options":["A. In the future","B. In future","C. At the future"],"answer":"B","explain":"对今后行为的要求用 in future"},"difficulty":3},{"id":"pit-004","title":"each other vs one another — 两者 vs 三者及以上（传统区分）","category":"形近/义近混淆","phrases":[{"semId":"7a","num":1},{"semId":"7b","num":3}],"comparison":[{"phrase":"each other","pos":"代词短语","meaning":"互相（传统：两者之间）","usage":"The twins help each other.","eg":"The two friends hugged each other."},{"phrase":"one another","pos":"代词短语","meaning":"互相（传统：三者及以上）","usage":"All classmates help one another.","eg":"The team members support one another."}],"commonMistakes":[{"wrong":"（现代英语中两者常混用，但教材分列，考试中可能要求区分）","right":"按传统规则答题：两者用 each other，三人以上用 one another","explain":"人教版7上和7下分别教授，说明教材有意区分"}],"testExample":{"type":"选词填空","question":"The twins love ___ very much. / All the students in the class help ___.","answer":"each other; one another"},"difficulty":2},{"id":"pit-005","title":"too many vs too much vs much too — 三胞胎彻底辨析","category":"形近/义近混淆","phrases":[{"semId":"7b","num":7},{"semId":"7b","num":35}],"comparison":[{"phrase":"too many","pos":"限定词短语","meaning":"太多（+可数名词复数）","usage":"too many + 可数名词复数","eg":"too many people / too many mistakes"},{"phrase":"too much","pos":"限定词 / 副词短语","meaning":"太多（+不可数名词 / 修饰动词）","usage":"too much + 不可数名词 / V + too much","eg":"too much water / eat too much"},{"phrase":"much too","pos":"副词短语（教材未直接收录，但学生易混）","meaning":"实在太...（+形容词/副词）","usage":"much too + adj / adv","eg":"much too hot / much too fast"}],"commonMistakes":[{"wrong":"There are too much people.","right":"There are too many people.","explain":"people 可数，用 too many"},{"wrong":"This coffee is too much hot.","right":"This coffee is much too hot.","explain":"修饰形容词 hot 用 much too"}],"testExample":{"type":"选择题","question":"He ate ___ and felt sick. There was ___ food on the table.","options":["A. too many; too much","B. too much; too much","C. too much; much too","D. much too; too much"],"answer":"B"},"difficulty":3},{"id":"pit-006","title":"a few / few / quite a few — 肯定 vs 否定 vs 相当多","category":"形近/义近混淆","phrases":[{"semId":"7b","num":25}],"comparison":[{"phrase":"a few","pos":"限定词短语","meaning":"几个、一些（肯定含义：有，虽然不多）","eg":"I have a few friends here, so I'm not lonely."},{"phrase":"few","pos":"限定词（教材未直接收）","meaning":"几乎没有（否定含义：少到几乎没有）","eg":"He has few friends. He feels lonely."},{"phrase":"quite a few","pos":"限定词短语（教材未直接收）","meaning":"相当多（= many）","eg":"Quite a few students passed the exam."}],"commonMistakes":[{"wrong":"He has a few money.","right":"He has a little money.","explain":"few/a few + 可数；a little/little + 不可数"}],"testExample":{"type":"选择题","question":"I have ___ friends here, so I feel quite happy.","options":["A. few","B. a few","C. little","D. a little"],"answer":"B","explain":"肯定含义+可数名词→a few"},"difficulty":2},{"id":"pit-007","title":"do exercises vs do exercise — 可数 vs 不可数","category":"形近/义近混淆","phrases":[{"semId":"7a","num":34},{"semId":"7a","num":35}],"comparison":[{"phrase":"do exercises","pos":"动词短语","meaning":"做操/做练习题（可数，指具体的动作）","eg":"do morning exercises / do math exercises"},{"phrase":"do exercise","pos":"动词短语","meaning":"锻炼身体（不可数，泛指体育锻炼）","eg":"do exercise regularly to keep fit"}],"commonMistakes":[{"wrong":"I do morning exercise every day.","right":"I do morning exercises every day.","explain":"早操是一套具体动作，用复数 exercises"},{"wrong":"You should do more exercises to stay healthy.","right":"You should do more exercise to stay healthy.","explain":"泛指锻炼身体，用不可数 exercise"}],"testExample":{"type":"选择题","question":"We ___ every morning to stay healthy, and we also ___ in math class.","options":["A. do exercise; do exercises","B. do exercises; do exercise","C. do exercise; do exercise","D. do exercises; do exercises"],"answer":"A"},"difficulty":2},{"id":"pit-008","title":"used to do vs be/get used to doing — 过去习惯 vs 现在习惯","category":"形近/义近混淆","phrases":[{"semId":"7b","num":78},{"semId":"8b","num":73}],"comparison":[{"phrase":"used to do","pos":"情态动词短语","meaning":"过去常常做（现在不做了）","usage":"used to + 动词原形","eg":"I used to get up late, but now I get up early."},{"phrase":"be/get used to doing","pos":"动词短语","meaning":"习惯做某事","usage":"be/get used to + 名词/doing（to是介词！）","eg":"I am used to getting up early now."}],"commonMistakes":[{"wrong":"I am used to get up early.","right":"I am used to getting up early.","explain":"be used to 中的 to 是介词，后面接 doing，不是 do！"},{"wrong":"I used to getting up late.","right":"I used to get up late.","explain":"used to do 后面接动词原形"}],"testExample":{"type":"填空题","question":"He ___ (过去常常) smoke, but now he ___ (习惯) living a healthy life.","answer":"used to; is used to"},"difficulty":3},{"id":"pit-009","title":"some day vs someday — 分开 vs 合并","category":"形近/义近混淆","phrases":[{"semId":"7b","num":64}],"comparison":[{"phrase":"some day","pos":"副词短语","meaning":"某一天（指具体的、不确定的一天）","eg":"Let's meet some day next week."},{"phrase":"someday","pos":"副词","meaning":"总有一天、有朝一日（= one day，指遥远的将来）","eg":"Someday I'll travel around the world."}],"commonMistakes":[{"wrong":"（考试通常通过语境选择分开/合并形式）","right":"具体某天→ some day；未来某天（梦想）→ someday"}],"testExample":{"type":"判断正误","question":"I hope someday I can visit Yunnan again.","explain":"✓：someday 指有朝一日（梦想），用合并形式正确"},"difficulty":2},{"id":"pit-010","title":"be made of vs be made from — 看得出 vs 看不出原材料","category":"形近/义近混淆","phrases":[{"semId":"7b","num":8}],"comparison":[{"phrase":"be made of","pos":"动词短语（系表）","meaning":"由…制成（看得出原材料）","eg":"The desk is made of wood. → 看得出是木头"},{"phrase":"be made from","pos":"动词短语（教材未直接收）","meaning":"由…制成（看不出原材料）","eg":"Paper is made from wood. → 看不出是木头"}],"commonMistakes":[{"wrong":"Paper is made of wood.","right":"Paper is made from wood.","explain":"纸看不出木头的样子→ from"},{"wrong":"The chair is made from wood.","right":"The chair is made of wood.","explain":"椅子能看出木头的纹理→ of"}],"testExample":{"type":"选择题","question":"The ring is ___ gold. / Wine is ___ grapes.","options":["A. made of; made of","B. made from; made from","C. made of; made from","D. made from; made of"],"answer":"C","explain":"金戒指看得出金子→of；葡萄酒看不出葡萄→from"},"difficulty":2},{"id":"pit-101","title":"have fun (in) doing — 介词后必须用 doing","category":"固定搭配·介词后接doing","phrases":[{"semId":"7a","num":22}],"comparison":[{"phrase":"have fun","pos":"动词短语","meaning":"玩得开心","usage":"have fun (in) doing sth（in 常省略，但 doing 保留）"}],"commonMistakes":[{"wrong":"We had fun to swim in the sea.","right":"We had fun swimming in the sea.","explain":"fun 后面省略了介词 in，所以要用 doing，不能用 to do"}],"testExample":{"type":"填空题","question":"The children had great fun ___ (play) in the park.","answer":"playing"},"difficulty":3},{"id":"pit-102","title":"look forward to doing — to 是介词，不是不定式符号！","category":"固定搭配·介词后接doing","phrases":[{"semId":"7b","num":50}],"comparison":[{"phrase":"look forward to","pos":"动词短语","meaning":"期盼、期待","usage":"look forward to + n./pron./doing（to 是介词！）"},{"note":"同理：pay attention to, be used to, belong to, lead to 中的 to 都是介词，后面都可以接 doing","eg":"pay attention to writing / be used to getting up early"}],"commonMistakes":[{"wrong":"I look forward to see you.","right":"I look forward to seeing you.","explain":"这是中国学生最高频错误之一！to 在这里是介词而非不定式符号"}],"testExample":{"type":"填空题","question":"I'm looking forward to ___ (hear) from you soon.","answer":"hearing"},"difficulty":3},{"id":"pit-103","title":"be worth doing — 主动形式表被动含义","category":"固定搭配·介词后接doing","phrases":[{"semId":"9b","num":30}],"comparison":[{"phrase":"be worth doing","pos":"形容词短语（系表）","meaning":"值得做","usage":"be worth + doing（用主动形式，但含义可被动）"}],"commonMistakes":[{"wrong":"The book is worth being read.","right":"The book is worth reading.","explain":"worth 后用主动形式的 doing，不用于被动"}],"testExample":{"type":"填空题","question":"This movie is worth ___ (watch) a second time.","answer":"watching"},"difficulty":3},{"id":"pit-104","title":"succeed in doing sth","category":"固定搭配·介词后接doing","phrases":[{"semId":"7b","num":102}],"comparison":[{"phrase":"succeed in doing sth","pos":"动词短语","meaning":"成功做某事","usage":"succeed in + n./doing"}],"commonMistakes":[{"wrong":"He succeeded to pass the exam.","right":"He succeeded in passing the exam.","explain":"succeed 不能接 to do，只能接 in doing"}],"testExample":{"type":"同义句","question":"He passed the exam. → He ___ ___ ___ the exam.","answer":"succeeded in passing"},"difficulty":2},{"id":"pit-105","title":"be good at / be interested in / dream of / stop…from — 全部接 doing","category":"固定搭配·介词后接doing","phrases":[{"semId":"7a","num":40},{"semId":"7a","num":48},{"semId":"8b","num":10},{"semId":"8b","num":15}],"comparison":[{"phrase":"be good at doing","meaning":"擅长做某事","eg":"She is good at dancing."},{"phrase":"be interested in doing","meaning":"对…感兴趣","eg":"He is interested in collecting stamps."},{"phrase":"dream of doing","meaning":"梦想做某事","eg":"She dreams of becoming a singer."},{"phrase":"stop sb from doing","meaning":"阻止某人做某事","eg":"The rain stopped us from going out."},{"phrase":"keep on doing","meaning":"持续做某事","eg":"Keep on trying!"},{"phrase":"worry about doing","meaning":"担心做某事","eg":"Don't worry about failing."},{"phrase":"think about doing","meaning":"考虑做某事","eg":"I'm thinking about changing my job."},{"phrase":"feel like doing","meaning":"想做某事","eg":"I feel like going for a walk."}],"commonMistakes":[{"wrong":"以上短语后面统一不能接 to do！","right":"全部接 doing（动名词）","explain":"这些短语末尾的词（at, in, of, from, on, about, like）都是介词，介词后面必须接名词性成分——动词变成 doing"}],"testExample":{"type":"填空题","question":"Are you interested in ___ (join) the club?","answer":"joining"},"difficulty":2},{"id":"pit-201","title":"help sb with sth vs help sb (to) do sth — 两种结构都要掌握","category":"含sb/sth槽位结构","phrases":[{"semId":"7a","num":38}],"comparison":[{"phrase":"help sb with sth","meaning":"在某事上帮助某人","structure":"help + sb + with + 名词","eg":"He helps me with my English."},{"phrase":"help sb (to) do sth","meaning":"帮助某人做某事","structure":"help + sb + (to) do + 某事","eg":"He helps me learn English."}],"commonMistakes":[{"wrong":"He helped me with learn English.","right":"He helped me with my English. / He helped me (to) learn English.","explain":"with 后接名词，不能接动词；两种结构不能混用"}],"testExample":{"type":"句型转换","question":"He helps me with my homework. = He helps me ___ ___ my homework.","answer":"(to) do"},"difficulty":2},{"id":"pit-202","title":"prepare sth for sb — 为某人准备某物","category":"含sb/sth槽位结构","phrases":[{"semId":"7a","num":61}],"comparison":[{"phrase":"prepare sth for sb","structure":"prepare + 某物 + for + 某人","eg":"Mom prepared a big dinner for us."},{"phrase":"prepare for sth","structure":"prepare + for + 某事（为…做准备）","eg":"We are preparing for the exam."}],"commonMistakes":[{"wrong":"Mom prepared for us a big dinner.","right":"Mom prepared a big dinner for us.","explain":"prepare sb sth 不常见；用 prepare sth for sb"}],"difficulty":2},{"id":"pit-203","title":"share sth with sb — 和某人分享某物","category":"含sb/sth槽位结构","phrases":[{"semId":"8a","num":26}],"comparison":[{"phrase":"share sth with sb","structure":"share + 某物 + with + 某人","eg":"I shared my lunch with him."}],"commonMistakes":[{"wrong":"I shared my lunch to him.","right":"I shared my lunch with him.","explain":"share 搭配介词 with，不是 to"}],"difficulty":1},{"id":"pit-204","title":"agree with sb vs agree to sth — 介词决定宾语类型","category":"含sb/sth槽位结构","phrases":[{"semId":"7b","num":84}],"comparison":[{"phrase":"agree with sb","meaning":"同意某人（的意见）","eg":"I agree with you."},{"phrase":"agree to sth","meaning":"同意某事（计划/建议）","eg":"He agreed to the plan."},{"phrase":"agree to do sth","meaning":"同意做某事（to 是不定式）","eg":"She agreed to help us."}],"commonMistakes":[{"wrong":"I agree you.","right":"I agree with you.","explain":"agree 是不及物动词，不能直接接宾语，需要介词"}],"difficulty":2},{"id":"pit-205","title":"give sb a lift / lend sb a hand — 固定双宾语","category":"含sb/sth槽位结构","phrases":[{"semId":"8a","num":21},{"semId":"8a","num":37}],"comparison":[{"phrase":"give sb a lift","meaning":"捎某人一程","eg":"Can you give me a lift?"},{"phrase":"lend sb a hand","meaning":"帮某人一把","eg":"Could you lend me a hand?"}],"commonMistakes":[{"wrong":"give a lift to me / lend a hand to me → 语法没错但不自然","right":"give me a lift / lend me a hand（双宾语更自然）"}],"difficulty":2},{"id":"pit-206","title":"show sb around — 带某人参观","category":"含sb/sth槽位结构","phrases":[{"semId":"8a","num":84}],"comparison":[{"phrase":"show sb around (somewhere)","structure":"show + sb + around + (地点)","eg":"Let me show you around the school."}],"commonMistakes":[{"wrong":"Let me show around you.","right":"Let me show you around.","explain":"around 放在宾语之后，不是之前"}],"difficulty":2},{"id":"pit-301","title":"work out — 解决 vs 锻炼","category":"一词多义","phrases":[{"semId":"7a","num":42},{"semId":"7b","num":31}],"comparison":[{"phrase":"work out (7上)","meaning":"解出（题目）、解决（问题）= solve","eg":"Can you work out this math problem?"},{"phrase":"work out (7下)","meaning":"锻炼身体 = exercise","eg":"He works out at the gym every day."},{"phrase":"work out (进阶)","meaning":"进展顺利 = go well","eg":"Things worked out well in the end."}],"commonMistakes":[{"wrong":"（学生通常在阅读中遇到不熟悉的义项时理解错误）","right":"根据上下文判断：接 problem 等词→解决；接地点/频率→锻炼；接 well→进展"}],"testExample":{"type":"一词多义选择","question":"① He ___ the answer quickly. ② She ___ at the gym every morning.","options":["A. worked out; works out","B. worked on; works on"],"answer":"A","explain":"句①解决=worked out；句②锻炼=works out"},"difficulty":2},{"id":"pit-302","title":"put 家族七胞胎 — put up/on/off/out/back","category":"一词多义","phrases":[{"semId":"7a","num":30},{"semId":"7b","num":37},{"semId":"8a","num":54},{"semId":"8a","num":72},{"semId":"9a","num":20}],"comparison":[{"phrase":"put up","meaning":"张贴；搭建；举起","eg":"put up a poster / a tent / your hand"},{"phrase":"put on","meaning":"穿上；上演；增加（体重）","eg":"put on a coat / a play / weight"},{"phrase":"put off","meaning":"推迟 = delay","eg":"put off the meeting"},{"phrase":"put out","meaning":"扑灭（火）= extinguish","eg":"put out the fire"},{"phrase":"put sth back","meaning":"把…放回原处","eg":"Put the book back on the shelf."}],"commonMistakes":[{"wrong":"put off 也可能被理解为'脱下'（实际是 take off）","right":"脱下=take off；推迟=put off——中国学生经典混淆"}],"testExample":{"type":"选择题","question":"Never ___ till tomorrow what you can do today.","options":["A. put up","B. put on","C. put off","D. put out"],"answer":"C"},"difficulty":3},{"id":"pit-303","title":"take 大家族 — take up/over/off/place/part in/care of","category":"一词多义","phrases":[{"semId":"8a","num":71},{"semId":"8a","num":76},{"semId":"7b","num":57},{"semId":"7b","num":1}],"comparison":[{"phrase":"take up","meaning":"开始学/从事；占据（空间/时间）","eg":"take up a hobby; The table takes up too much space."},{"phrase":"take over","meaning":"接管；取代","eg":"take over the business"},{"phrase":"take place","meaning":"发生（= happen，无被动）","eg":"The story takes place in Beijing."},{"phrase":"take part in","meaning":"参加（活动）= join in","eg":"take part in the competition"},{"phrase":"take care of","meaning":"照顾 = look after","eg":"take care of the baby"}],"commonMistakes":[{"wrong":"The meeting was taken place last week.","right":"The meeting took place last week.","explain":"take place = happen，不及物，不能用于被动语态！"}],"testExample":{"type":"选择题","question":"Great changes have ___ in China in recent years.","options":["A. taken place","B. been taken place","C. taken part","D "explain":"Not only 在句首→部分倒装（助动词提前）"}],"testExample":{"type":"句型转换","question":"He not only sings well but also dances well. → Not only ___ ___ ___ well, but he also dances well.","answer":"does he sing"},"difficulty":3},{"id":"pit-602","title":"so...that... vs such...that... — 经典必考","category":"连词与时态/语序","phrases":[{"semId":"8b","num":69}],"comparison":[{"phrase":"so + adj/adv + that","meaning":"如此…以至于…","eg":"He runs so fast that nobody can catch him."},{"phrase":"such + (a/an) + n + that","meaning":"如此…以至于…","eg":"He is such a fast runner that nobody can catch him."}],"testExample":{"type":"选择题","question":"It was ___ fine weather that we decided to go hiking.","options":["A. so","B. such","C. so a","D. such a"],"answer":"B","explain":"weather 不可数→such（无a）；若说 such a fine day（可数）也对"},"difficulty":3},{"id":"pit-603","title":"neither...nor... — 就近原则","category":"连词与时态/语序","phrases":[{"semId":"9a","num":63}],"comparison":[{"phrase":"neither...nor...","meaning":"既不…也不…","key":"就近原则：谓语动词与 nor 后的主语一致","eg":"Neither he nor I am wrong."}],"commonMistakes":[{"wrong":"Neither he nor I are wrong.","right":"Neither he nor I am wrong.","explain":"nor 后是 I→用 am"},{"wrong":"Neither I nor he are wrong.","right":"Neither I nor he is wrong.","explain":"nor 后是 he→用 is"}],"difficulty":3},{"id":"pit-604","title":"as soon as / as long as — 主将从现","category":"连词与时态/语序","phrases":[{"semId":"8b","num":60},{"semId":"8a","num":81}],"comparison":[{"phrase":"as soon as","meaning":"一…就…","rule":"时间状语从句→主将从现","eg":"I will call you as soon as I arrive."},{"phrase":"as long as","meaning":"只要","rule":"条件状语从句→主将从现","eg":"I will go as long as you go with me."}],"commonMistakes":[{"wrong":"I will call you as soon as I will arrive.","right":"I will call you as soon as I arrive.","explain":"as soon as 引导的从句用一般现在时表将来"}],"difficulty":2},{"id":"pit-605","title":"only if vs if only — 语序不同，意思天差地别","category":"连词与时态/语序","phrases":[{"semId":"7b","num":97}],"comparison":[{"phrase":"only if","meaning":"只有…才（= on ties","right":"in his forties（四十多岁）/ in the forties（四十年代）"}],"difficulty":2},{"id":"pit-705","title":"thousands of / hundreds of / millions of — 虚指 vs 实指","category":"形态变化易错","phrases":[{"semId":"8a","num":5},{"semId":"9a","num":36},{"semId":"9b","num":11}],"comparison":[{"phrase":"thousands of","meaning":"成千上万的（虚指，+s +of）","eg":"Thousands of people came."},{"phrase":"two thousand","meaning":"二千（实指，无s 无of）","eg":"Two thousand people came."}],"commonMistakes":[{"wrong":"two thousands / two thousands of","right":"two thousand（实指数字，不加s）"},{"wrong":"thousand of","right":"thousands of（虚指，要加s+of）"}],"testExample":{"type":"改错","question":"Two thousands of students took part in the activity.","answer":"Two thousand students（去掉s和of）"},"difficulty":3},{"id":"pit-706","title":"daily routines / do chores — 习惯用复数","category":"形态变化易错","phrases":[{"semId":"7a","num":59},{"semId":"8b","num":56}],"comparison":[{"phrase":"daily routines","note":"日常安排，routine 习惯用复数"},{"phrase":"do chores","note":"做家务，chore 习惯用复数"}],"difficulty":1},{"id":"pit-801","title":"because of vs because — 介词 vs 连词","category":"形近/义近混淆","phrases":[{"semId":"7b","num":70}],"comparison":[{"phrase":"because of","pos":"介词短语","usage":"because of + 名词/代词/doing","eg":"He was late because of the rain."},{"phrase":"because","pos":"连词","usage":"because + 句子（主谓结构）","eg":"He was late because it rained."}],"testExample":{"type":"选择题","question":"We stayed at home ___ the heavy rain. / We stayed at home ___ it rained heavily.","options":["A. because; because","B. because of; because of","C. because of; because","D. because; because of"],"answer":"C"},"difficulty":2},{"id":"pit-802","title":"instead of vs instead — 介词 vs 副词","category":"形近/义近混淆","phrases":[{"semId":"7b","num":101}],"comparison":[{"phrase":"instead of","pos":"介词短语","usage":"instead of + 名词/代词/doing","eg":"Let's walk instead of taking a bus."},{"phrase":"instead","pos":"副词","usage":"独立使用，放句首或句末","eg":"He didn't take a bus. He walked instead."}],"difficulty":2},{"id":"pit-803","title":"such as vs for example — 列举 vs 举例","category":"形近/义近混淆","phrases":[{"semId":"7b","num":54},{"semId":"7a","num":63}],"comparison":[{"phrase":"such as","usage":"例如（接名词/名词短语列举，不用逗号）","eg":"I like sports such as basketball and tennis."},{"phrase":"for example","usage":"例如（接句子，通常有逗号）","eg":"I like many sports. For example, I play basketball every weekend."}],"difficulty":2},{"id":"pit-804","title":"at the moment vs at that moment — 现在进行时 vs 过去进行时","category":"时间/方位介词辨析","phrases":[{"semId":"7b","num":44}],"comparison":[{"phrase":"at the moment","meaning":"此刻、现在","tense":"常用于现在进行时","eg":"She is sleeping at the moment."},{"phrase":"at that moment","meaning":"在那时","tense":"常用于过去进行时","eg":"At that moment, she was sleeping."}],"difficulty":2},{"id":"pit-805","title":"so far — 现在完成时标志","category":"时间/方位介词辨析","phrases":[{"semId":"8b","num":11}],"comparison":[{"phrase":"so far","meaning":"到目前为止（= up to now）","tense":"现在完成时","eg":"So far we have learned 100 phrases."}],"commonMistakes":[{"wrong":"So far we learned 100 phrases.","right":"So far we have learned 100 phrases.","explain":"so far 是现在完成时的标志词"}],"difficulty":2},{"id":"pit-806","title":"in fact / as a result / for this reason — 副词连接语辨析","category":"形近/义近混淆","phrases":[{"semId":"8a","num":43},{"semId":"8b","num":67},{"semId":"8a","num":44}],"comparison":[{"phrase":"in fact","meaning":"事实上（强调/纠正）"},{"phrase":"as a result","meaning":"结果（因果关系）"},{"phrase":"for this reason","meaning":"因此（原因→结果）"}],"difficulty":2},{"id":"pit-901","title":"not…at all — 一点儿也不","category":"固定搭配·介词后接doing","phrases":[{"semId":"7b","num":10}],"comparison":[{"phrase":"not…at all","meaning":"一点儿也不","usage":"not + 动词/形容词 + at all","eg":"I don't like it at all."}],"difficulty":1},{"id":"pit-902","title":"quite a / quite a few — 强调限定词","category":"形近/义近混淆","phrases":[{"semId":"7b","num":9}],"comparison":[{"phrase":"quite a + 可数名词单数","meaning":"真是一个… / 相当…","eg":"That's quite a story!"}],"difficulty":1},{"id":"pit-903","title":"pick up 多义 — 捡起 / 接人 / 学会","category":"一词多义","phrases":[{"semId":"7b","num":2}],"comparison":[{"phrase":"pick up","meaning":"①捡起 ②(用车)接人 ③(无意中)学会 ④好转","eg":"pick up the pen / pick me up at 5 / pick up some French / Business is picking up."}],"difficulty":2},{"id":"pit-904","title":"drop off / drop out — 多义区分","category":"一词多义","phrases":[{"semId":"7b","num":56},{"semId":"9a","num":6}],"comparison":[{"phrase":"drop off","meaning":"①送（某人到某地）②打瞌睡 ③减少","eg":"I'll drop you off at the station."},{"phrase":"drop out (of)","meaning":"退出；辍学","eg":"He dropped out of school."}],"difficulty":2},{"id":"pit-905","title":"go off 多义 — 闹钟响 / 爆炸 / 变质","category":"一词多义","phrases":[{"semId":"8b","num":63}],"comparison":[{"phrase":"go off","meaning":"①（闹钟）响 ②爆炸 ③（食物）变质 ④离开","eg":"The alarm went off. / The bomb went off. / The milk has gone off."}],"difficulty":2},{"id":"pit-906","title":"make up 多义 — 和好 / 编造 / 组成 / 化妆","category":"一词多义","phrases":[{"semId":"8a","num":85}],"comparison":[{"phrase":"make up with sb","meaning":"与某人和好"},{"phrase":"make up a story","meaning":"编造故事"},{"phrase":"be made up of","meaning":"由…组成"},{"phrase":"make up one's face","meaning":"化妆"}],"difficulty":2},{"id":"pit-907","title":"fight against sb — 介词固定 with/against 辨析","category":"含sb/sth槽位结构","phrases":[{"semId":"8a","num":4}],"comparison":[{"phrase":"fight against sb/sth","meaning":"与…作斗争、对抗…","eg":"fight against the disease"},{"phrase":"fight with sb","meaning":"①与…打架/战斗 ②与…并肩作战（看上下文）","eg":"fight with a friend / fight with the allies"}],"difficulty":2},{"id":"pit-908","title":"worry about vs be worried about — 动词 vs 形容词","category":"形近/义近混淆","phrases":[{"semId":"8a","num":87}],"comparison":[{"phrase":"worry about","pos":"动词短语","eg":"Don't worry about me."},{"phrase":"be worried about","pos":"形容词短语","eg":"I'm worried about you."}],"difficulty":2},{"id":"pit-909","title":"put on vs wear vs dress — 穿上（动作）vs 穿着（状态）vs 给…穿衣","category":"一词多义","phrases":[{"semId":"7b","num":37}],"comparison":[{"phrase":"put on","meaning":"穿上（动作）"},{"phrase":"wear","meaning":"穿着（状态）"},{"phrase":"dress / get dressed","meaning":"穿好衣服（dress+人）"}],"testExample":{"type":"选择题","question":"It's cold outside. Please ___ your coat. / She always ___ a red dress.","options":["A. put on; wears","B. wear; puts on","C. dress; puts on","D. put on; dresses"],"answer":"A"},"difficulty":2},{"id":"pit-910","title":"alone vs lonely — 客观独处 vs 主观孤独","category":"形近/义近混淆","phrases":[],"comparison":[{"phrase":"alone (adj/adv)","meaning":"独自的（客观状态，不一定是负面）","eg":"She lives alone but she doesn't feel lonely."},{"phrase":"lonely (adj)","meaning":"孤独的（主观感受，负面）","eg":"He felt lonely in the big city."}],"difficulty":2},{"id":"pit-911","title":"as...as... / not as(so)...as... — 同级比较","category":"连词与时态/语序","phrases":[],"comparison":[{"phrase":"as + adj/adv + as","meaning":"和…一样","eg":"He is as tall as his father."},{"phrase":"not as(so) + adj/adv + as","meaning":"不如…","eg":"He is not as tall as his father."}],"difficulty":2},{"id":"pit-912","title":"have to vs must — 客观必须 vs 主观必须","category":"形近/义近混淆","phrases":[{"semId":"7b","num":13}],"comparison":[{"phrase":"have to","meaning":"不得不（客观需要/外部要求）","eg":"I have to go now. It's getting dark."},{"phrase":"must","meaning":"必须（主观认为/内在义务）","eg":"I must study hard for the exam."}],"difficulty":2},{"id":"pit-913","title":"more than / less than — 比较句型（可与 no more than 对比）","category":"形态变化易错","phrases":[{"semId":"7a","num":49}],"comparison":[{"phrase":"more than","meaning":"多于、超过","eg":"more than 100 people"},{"phrase":"less than","meaning":"少于","eg":"less than 10 minutes"},{"phrase":"no more than","meaning":"仅仅、只有（= only，强调少）","eg":"He has no more than 10 dollars."},{"phrase":"not more than","meaning":"不超过、至多（= at most）","eg":"He has not more than 10 dollars."}],"difficulty":3}]};

<script>

// app.js — 平台应用逻辑（注入到 index.html 的 <script> 中）
// 注意: 本文件是真正的 JS 源码，正则反斜杠原样保留，不经过模板字符串消费。

// ===== 状态 =====
const state = {
  semId: DATA.semesters[0].id,
  mode: 'learn',
  unitFilter: 'all',
  posFilter: 'all',
  diffFilter: 'all',
  search: '',
  shuffle: false,
  onlyWrong: false,
  flashIdx: 0,
  flashFlipped: false,
  pdfType: 'fill',
  pdfTraining: 'all',
  pdfOnlyWrong: false,
  sidebarOpen: false,
  pitfallCatFilter: 'all',
  pitfallSearch: '',
  pitfallShowAnswers: {},
};

const PROGRESS_KEY = 'vp79_progress_v1';
let progress = loadProgress();

function loadProgress() {
  try { return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; } catch (e) { return {}; }
}
function saveProgress() { localStorage.setItem(PROGRESS_KEY, JSON.stringify(progress)); }

function sem() { return DATA.semesters.find(s => s.id === state.semId); }

// ===== 容错比对 =====
const RE_ELL = /\u2026/g;
const RE_DOTS = /\.{2,}/g;
const RE_WS = /\s+/g;
const RE_LSQ = /[\u2018\u2019]/g;
const RE_LDQ = /[\u201c\u201d]/g;
const RE_FLP = /\uff08/g;
const RE_FRP = /\uff09/g;
const RE_SLA = /[/\uff0f]/;
const RE_SBCSB = /\\bsb\\b/g;
const RE_SBSTH = /\\bsth\\b/g;
const RE_UND = /_/g;

function normalize(s) {
  return (s || '').toString().trim().toLowerCase()
    .replace(RE_ELL, '...').replace(RE_DOTS, '...').replace(RE_WS, ' ')
    .replace(RE_LSQ, "'").replace(RE_LDQ, '"')
    .replace(RE_FLP, '(').replace(RE_FRP, ')')
    .replace(RE_SBCSB, '_').replace(RE_SBSTH, '_');
}
function checkAnswer(input, answers) {
  if (!Array.isArray(answers)) answers = [answers];
  const ni = normalize(input);
  if (!ni) return false;
  for (const a of answers) {
    const opts = a.split(RE_SLA).map(x => normalize(x));
    for (const o of opts) {
      if (o === ni) return true;
      if (o.replace(RE_UND, '').trim() === ni.replace(RE_UND, '').trim()) return true;
    }
  }
  return false;
}

// ===== 高亮渲染 =====
function renderSegments(segs) {
  if (!segs) return '';
  if (typeof segs === 'string') return esc(segs);
  return segs.map(s => {
    if (s.type === 'phrase') return '<span class="hl-phrase">' + esc(s.text) + '</span>';
    if (s.type === 'be') return '<span class="hl-be">' + esc(s.text) + '</span>';
    return esc(s.text);
  }).join('');
}
function esc(s) { return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }

// ===== 顶部导航 =====
function renderHeader() {
  const semTabs = document.getElementById('semTabs');
  semTabs.innerHTML = DATA.semesters.map(s =>
    '<button class="sem-tab' + (s.id === state.semId ? ' active' : '') + '" data-sem="' + s.id + '">' + s.short + '</button>'
  ).join('');

  const modes = [
    ['learn', '📚 学习'],
    ['fill', '✍ 填空测试'],
    ['en2cn', '🔁 看英写中'],
    ['cn2en', '🔁 看中写英'],
    ['pitfalls', '🔍 考点辨析'],
    ['flash', '🃏 闪卡'],
    ['pdf', '📄 导出PDF'],
  ];
  const mt = document.getElementById('modeTabs');
  mt.innerHTML = modes.map(m =>
    '<button class="mode-tab' + (state.mode === m[0] ? ' active' : '') + '" data-mode="' + m[0] + '">' + m[1] + '</button>'
  ).join('');

  updateProgressMini();
}

function updateProgressMini() {
  const s = sem();
  const mkey = s.id + '_m';
  const mastered = (progress[mkey] || {})._c || 0;
  const total = s.phraseCount;
  const pct = total ? Math.round(mastered / total * 100) : 0;
  document.getElementById('progressMini').textContent = '已掌握 ' + mastered + '/' + total + ' (' + pct + '%)';
}

// ===== 侧边栏 =====
function renderSidebarInner() {
  const s = sem();
  const units = ['all'];
  s.phrases.forEach(p => { if (p.unit && !units.includes(p.unit)) units.push(p.unit); });
  const posList = ['all', '动词短语', '名词短语', '副词短语', '介词短语', '连词短语', '形容词短语', '限定词短语', '其他'];
  const diffs = ['all', 1, 2, 3];

  let html = '<div class="sidebar"><h4>单元</h4>';
  html += units.map(u => '<button class="filter-btn' + (state.unitFilter === u ? ' active' : '') + '" data-unit="' + esc(u) + '">' + (u === 'all' ? '全部' : esc(u)) + '</button>').join('');
  html += '<h4>词性</h4>' + posList.map(p => '<button class="filter-btn' + (state.posFilter === p ? ' active' : '') + '" data-pos="' + p + '">' + p + '</button>').join('');
  html += '<h4>难度</h4>' + diffs.map(d => '<button class="filter-btn' + (state.diffFilter === d ? ' active' : '') + '" data-diff="' + d + '">' + (d === 'all' ? '全部' : '⭐'.repeat(d)) + '</button>').join('');
  html += '<h4>统计</h4><div style="font-size:12px;color:var(--text-muted)">短语 ' + s.phraseCount + ' 条<br>训练题 ' + s.questionCount + ' 题</div>';
  html += '</div>';
  return html;
}

function filteredPhrases() {
  const s = sem();
  return s.phrases.filter(p => {
    if (state.unitFilter !== 'all' && p.unit !== state.unitFilter) return false;
    if (state.posFilter !== 'all' && p.posCategory !== state.posFilter) return false;
    if (state.diffFilter !== 'all' && p.difficulty !== state.diffFilter) return false;
    if (state.search) {
      const q = state.search.toLowerCase();
      if (!p.phrase.toLowerCase().includes(q) && !(p.basic && p.basic.cn.includes(state.search)) && !p.pos.toLowerCase().includes(q)) return false;
    }
    return true;
  });
}

// ===== 学习模式 =====
function renderLearn() {
  const list = filteredPhrases();
  let html = '<button class="filter-toggle" id="filterToggle">🎛 筛选' + (state.unitFilter !== 'all' || state.posFilter !== 'all' || state.diffFilter !== 'all' ? ' ·' : '') + '</button>';
  if (state.sidebarOpen) html += '<div class="sidebar-backdrop" id="sidebarBackdrop"></div>';
  html += '<div class="layout">';
  html += '<aside class="sidebar-wrap' + (state.sidebarOpen ? ' open' : '') + '" id="sidebarWrap">' + renderSidebarInner() + '</aside>';
  html += '<div class="content">';
  if (!list.length) { html += '<div class="empty-state"><div class="big">🔍</div>无匹配短语</div></div>'; return html + '</div></div>'; }
  list.forEach(p => {
    const mkey = sem().id + '_m';
    const mastered = (progress[mkey] || {})[p.num];
    html += '<div class="phrase-card" id="pc-' + p.num + '">';
    html += '<div class="phrase-head">';
    html += '<span class="phrase-num">' + p.num + '.</span>';
    html += '<span class="phrase-word">' + renderPhraseName(p.phrase) + '</span>';
    html += '<span class="tag">' + esc(p.pos) + '</span>';
    html += '<span class="stars">' + '⭐'.repeat(p.difficulty) + '</span>';
    html += '<div class="card-actions">';
    html += '<button class="act-speak" data-text="' + esc(p.phrase) + '" title="朗读">🔊</button>';
    html += '<button class="act-master' + (mastered ? ' mastered' : '') + '" data-num="' + p.num + '">' + (mastered ? '✓ 已掌握' : '标记掌握') + '</button>';
    html += '</div></div>';
    if (p.usageNote) {
      html += '<div class="usage-note">💡 ' + esc(p.usageNote) + '</div>';
    }
    // 考点辨析徽章
    if (window.PITFALLS) {
      const relPits = getPhrasePitfalls(sem().id, p.num);
      if (relPits.length) {
        html += '<div class="pit-badges">🔗 考点：';
        relPits.forEach(pid => {
          const pit = getPitfallById(pid);
          if (pit) html += '<span class="pit-badge" data-pitid="' + pid + '">' + esc(pit.title.length > 18 ? pit.title.slice(0,18) + '...' : pit.title) + '</span>';
        });
        html += '</div>';
      }
    }
    if (p.basic) {
      html += '<div class="example example-basic">';
      html += '<div class="example-label">🔹 初级例句 (' + esc(p.basic.structure) + ')</div>';
      html += '<div class="example-cn">' + renderSegments(p.basic.cnSegments) + '</div>';
      html += '<div class="example-en">' + renderSegments(p.basic.segments) + '</div>';
      html += '</div>';
    }
    if (p.posCategory === '动词短语' && !/^be\b/i.test(p.phrase)) {
      html += '<div style="margin-top:6px">' + renderVerbForms(p.phrase) + '</div>';
    }
    if (p.advanced) {

// 逐题批改填空（按钮或 Enter 键触发）
function gradeSingleFill(qid) {
  const s = sem();
  const inputs = document.querySelectorAll('input[data-qid="' + qid + '"]');
  if (!inputs.length) return;
  // 如果已经批改过，跳过（防重复）
  const fb = document.getElementById('fb-' + qid);
  if (fb && fb.textContent) return;
  // 查找题目数据
  let question = null, training = null;
  for (const t of s.trainings) {
    const tid = t.title.replace(/[^a-z0-9]/gi, '');
    for (const q of t.questions) {
      if (('fill-' + s.id + '-' + tid + '-' + q.no) === qid) { question = q; training = t; break; }
    }
    if (question) break;
  }
  if (!question) return;
  // 判断是否全空（不做题就批改 → 不给答案，只提示）
  var allEmpty = true;
  inputs.forEach(function(inp) { if (inp.value.trim()) allEmpty = false; });
  if (allEmpty) {
    toast('请先填写答案再批改');
    return;
  }
  var wk = s.id + '_w_' + training.title;
  if (!progress[wk]) progress[wk] = {};
  var allOk = true;
  inputs.forEach(function(inp, i) {
    var ans = question.answers[i] || question.answers[0];
    var ok = checkAnswer(inp.value, ans);
    inp.classList.remove('correct', 'wrong', 'correct-anim', 'wrong-anim');
    inp.classList.add(ok ? 'correct' : 'wrong');
    if (ok) { animateCorrect(inp); } else { animateWrong(inp); allOk = false; }
  });
  if (allOk) {
    fb.className = 'q-feedback ok fadeInUp'; fb.textContent = '✓ 正确';
    delete progress[wk][question.no];
    playCorrectSound();
  } else {
    fb.className = 'q-feedback bad fadeInUp';
    fb.innerHTML = '✗ 正确答案：<span class="ans">' + esc(question.answers.join(' / ')) + '</span>';
    progress[wk][question.no] = 1;
    playWrongSound();
  }
  saveProgress();
  updateFillScore();
}
function updateFillScore() {
  var correct = 0, total = 0;
  document.querySelectorAll('.q-feedback').forEach(function(fb) {
    if (fb.textContent) { total++; if (fb.classList.contains('ok')) correct++; }
  });
  var sc = document.getElementById('fillScore');
  if (sc && total) sc.textContent = '得分：' + correct + ' / ' + total + ' (' + Math.round(correct / total * 100) + '分)';
}

function gradeFill() {
